<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Penya Blaugrana Islamabad</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/animations.css">
<style>
  body{background:var(--night);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;position:relative;overflow:hidden}
  .login-tifo{position:fixed;inset:0;z-index:0}
  .login-veil{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse 60% 60% at 50% 50%, rgba(4,6,15,.97) 0%, rgba(4,6,15,.86) 55%, rgba(4,6,15,.55) 100%)}
  .login-card{
    position:relative;z-index:2;background:#fff;border-radius:var(--radius-lg);
    padding:48px 40px 40px;width:100%;max-width:410px;box-shadow:var(--shadow);overflow:hidden;
  }
  .login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:var(--senyera-rule)}
  .login-card .crest{width:52px;margin-bottom:22px}
  .login-card h1{font-size:1.7rem;color:var(--ink);margin-bottom:6px}
  .login-card p.sub{color:var(--muted);font-size:.9rem;margin-bottom:30px}
  .field{margin-bottom:20px}
  #err{display:none;background:rgba(165,0,68,.08);color:var(--grana);border-left:3px solid var(--grana);padding:12px 14px;font-size:.86rem;margin-bottom:18px;border-radius:2px}
</style>
</head>
<body>
  <div class="tifo login-tifo" aria-hidden="true"></div>
  <div class="login-veil" aria-hidden="true"></div>
  <div class="login-card">
    <img class="crest" src="https://pbisb.com/wp-content/uploads/2025/08/WhatsApp-Image-2025-08-16-at-13.14.56-1.png" alt="">
    <div class="eyebrow" style="color:var(--grana)">Admin</div>
    <h1>Sign in</h1>
    <p class="sub">Manage pricing, members and the club site.</p>
    <div id="err"></div>
    <form id="loginForm">
      <div class="field"><label>Username</label><input type="text" name="username" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div>
      <button type="submit" class="btn" style="width:100%;justify-content:center" id="loginBtn"><span>Sign in</span></button>
    </form>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const err = document.getElementById('err');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    const fd = new FormData(form);
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') }),
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent = data.error || 'Login failed';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }
      window.location.href = '/admin/dashboard';
    } catch {
      err.textContent = 'Network error, please try again.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
<script src="/animations.js"></script>
</body>
</html>
